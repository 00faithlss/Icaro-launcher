[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/ui"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/00faithlss/Icaro-launcher"

[workspace.dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Sin optimizar, SHA-512 procesa unos 10 MiB/s y cada comprobación de mods
# tarda decenas de segundos; optimizar solo los hashes no cambia la depuración.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.sha1]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
