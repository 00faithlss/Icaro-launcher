name: Empaquetar Windows
# Canales de publicación:
# - develop: beta, prerelease `v<versión>-beta.<compilación>` que solo ve el
#   canal Beta del launcher. La versión de Cargo debe ser mayor que la última
#   estable.
# - main: estable, release `v<versión>-build.<compilación>` marcada como la
#   más reciente, y tag fuente `v<versión>`. Cada estable exige subir la
#   versión de Cargo y sus notas en docs/releases.
# Otras ramas y los tags no publican. Una ejecución manual solo entrega
# artefactos.
on:
  workflow_dispatch:
  push:
    branches: ['main', 'develop']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/sync-host-linux.yml'
permissions:
  contents: write
concurrency:
  group: icaro-windows-publication
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ICARO_COMPILACION: ${{ github.run_id }}
      ICARO_CANAL: ${{ github.ref_name == 'develop' && 'beta' || 'estable' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Comprobar la versión del canal
        id: publicacion
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          'repetida=false' >> $env:GITHUB_OUTPUT
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') { exit 0 }
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo leer la versión de Cargo' }
          $version = ($metadata.packages | Where-Object name -EQ 'icaro-ui').version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Versión de Cargo no admitida: $version" }
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'No se pudieron consultar las releases' }
          $patron = if ($env:ICARO_CANAL -eq 'beta') { '^v(\d+\.\d+\.\d+)-beta\.\d+$' } else { '^v(\d+\.\d+\.\d+)-build\.\d+$' }
          $estables = @($releases | Where-Object { -not $_.draft -and -not $_.prerelease -and $_.tag_name -match '^v(\d+\.\d+\.\d+)-build\.\d+$' })
          $ultimaEstable = $estables | Sort-Object { [version]($_.tag_name -replace '^v(\d+\.\d+\.\d+)-build\.(\d+)$', '$1') }, { [long]($_.tag_name -replace '^.*\.', '') } | Select-Object -Last 1
          $previa = $releases | Where-Object { -not $_.draft -and ($_.prerelease -eq ($env:ICARO_CANAL -eq 'beta')) -and $_.tag_name -match $patron -and $Matches[1] -eq $version } | Sort-Object { [long]($_.tag_name -replace '^.*\.', '') } | Select-Object -Last 1
          # El mismo contenido ya publicado en este canal no se vuelve a compilar.
          if ($previa) {
            $assets = @($previa.assets.name)
            $completa = 'latest.json' -in $assets -and "icaro-$version-windows-x86_64.exe" -in $assets -and "icaro-$version-windows-x86_64-setup.exe" -in $assets
            $previousTree = gh api "repos/$env:GITHUB_REPOSITORY/commits/$($previa.tag_name)" --jq '.commit.tree.sha'
            if ($LASTEXITCODE -ne 0) { throw 'No se pudo comprobar la revisión publicada' }
            if ($completa -and $previousTree.Trim() -eq $tree) {
              'repetida=true' >> $env:GITHUB_OUTPUT
              Write-Output "El mismo contenido ya está publicado como $($previa.tag_name)."
              exit 0
            }
          }
          if ($ultimaEstable) {
            $estable = [version]($ultimaEstable.tag_name -replace '^v(\d+\.\d+\.\d+)-build\.\d+$', '$1')
            if ($env:ICARO_CANAL -eq 'beta' -and [version]$version -le $estable) {
              throw "develop tiene la versión $version y la última estable es $estable. Sube la versión de Cargo a la próxima entrega para publicar betas."
            }
            if ($env:ICARO_CANAL -eq 'estable' -and [version]$version -le $estable) {
              throw "main tiene la versión $version y la última estable es $estable. Cada estable exige subir la versión de Cargo y sus notas."
            }
          }
      # Reutiliza dependencias entre ejecuciones; no guarda artefactos de release
      # publicados ni altera la verificación de versión del canal.
      - name: Restaurar caché de Cargo
        if: steps.publicacion.outputs.repetida != 'true'
        uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: icaro-windows
      - name: Verificar núcleo e interfaz
        if: steps.publicacion.outputs.repetida != 'true'
        shell: pwsh
        run: |
          cargo test --locked -j1 -p icaro-core --lib --test actualizacion_local
          if ($LASTEXITCODE -ne 0) { throw 'Fallaron las pruebas del núcleo' }
          cargo test --locked -j1 -p icaro-ui --lib --example launcher -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Fallaron las pruebas de la interfaz' }
      - name: Preparar Inno Setup firmado
        if: steps.publicacion.outputs.repetida != 'true'
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'inno-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          $signature = Get-AuthenticodeSignature -LiteralPath $setup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*O=Pyrsys B.V.*') { throw 'Firma del compilador inválida' }
          $compiler = Join-Path $env:RUNNER_TEMP 'inno-6.7.3'
          $process = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/NOICONS',('/DIR="' + $compiler + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'No se pudo preparar Inno Setup' }
      - name: Compilar y empaquetar
        if: steps.publicacion.outputs.repetida != 'true'
        shell: pwsh
        run: ./scripts/empaquetar_windows.ps1 -Compilador (Join-Path $env:RUNNER_TEMP 'inno-6.7.3/ISCC.exe')
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: steps.publicacion.outputs.repetida != 'true'
        with:
          name: icaro-windows-x86_64
          path: target/dist/windows/*
          if-no-files-found: error
          retention-days: 30
      - name: Publicar actualización verificada
        if: github.event_name != 'workflow_dispatch' && steps.publicacion.outputs.repetida != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $metadata = Get-Content target/dist/windows/icaro-*-artefactos.json -Raw | ConvertFrom-Json
          $version = $metadata.version
          $beta = $env:ICARO_CANAL -eq 'beta'
          $tag = if ($beta) { "v$version-beta.$env:ICARO_COMPILACION" } else { "v$version-build.$env:ICARO_COMPILACION" }
          $notesFile = "docs/releases/$version.md"
          $notesData = Get-Content "docs/releases/$version.json" -Raw | ConvertFrom-Json
          if (-not (Test-Path -LiteralPath $notesFile) -or $notesData.version -ne $version -or $notesData.notas.Count -lt 1 -or $notesData.notas.Count -gt 200) { throw 'Faltan notas de versión válidas' }
          foreach ($note in $notesData.notas) {
            if ($note.tipo -notin @('nuevo','mejora','correccion') -or -not $note.texto -or $note.texto.Length -gt 4096) { throw 'Nota de versión inválida' }
          }
          $portable = Get-ChildItem target/dist/windows -Filter '*.exe' | Where-Object Name -NotLike '*-setup.exe' | Select-Object -First 1
          $setup = Get-ChildItem target/dist/windows -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $portable -or -not $setup) { throw 'Faltan artefactos de actualización' }
          $manifest = @{
            version = $version
            compilacion = [long]$env:ICARO_COMPILACION
            canal = $env:ICARO_CANAL
            notas = @($notesData.notas)
            plataformas = @{
              'windows-x86_64' = @{archivo=$portable.Name;sha256=(Get-FileHash -LiteralPath $portable.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
              'windows-x86_64-setup' = @{archivo=$setup.Name;sha256=(Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content target/dist/windows/latest.json -Encoding utf8
          $files = @(Get-ChildItem target/dist/windows -File | ForEach-Object FullName)
          $revision = (git rev-parse HEAD).Trim()
          if ($beta) {
            # Las prereleases nunca son la más reciente: los launchers estables,
            # también los anteriores a los canales, no las ven.
            gh release create $tag @files --target $revision --title "Icaro Launcher $version beta" --notes-file $notesFile --prerelease --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'No se pudo publicar la beta' }
            exit 0
          }
          gh release create $tag @files --target $revision --title "Icaro Launcher $version" --notes-file $notesFile --latest=true
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo publicar la actualización' }
          # Tag fuente de la estable, sobre la misma revisión que la release.
          $existente = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/v$version" --jq '.object.sha' 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "El tag v$version ya existe ($($existente.Trim()))."
          } else {
            gh api "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$version" -f "sha=$revision" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "No se pudo crear el tag v$version" }
          }
