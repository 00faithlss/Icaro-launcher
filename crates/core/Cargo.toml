[package]
name = "icaro-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1 = { workspace = true, features = ["oid"] }
thiserror.workspace = true
base64 = "0.22"
getrandom = "0.3"
sha2 = "0.10"
md-5 = "0.10"
rsa = { version = "0.9", features = ["sha1"] }
rand = "0.8"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
roxmltree = "0.20"
zip = { version = "9", default-features = false, features = ["deflate"] }
zeroize = { version = "1", features = ["serde"] }
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "process", "fs", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
webbrowser = "1"
image = { version = "0.24.9", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
trash = "5.2.9"
hickory-resolver = { version = "0.24.4", features = ["system-config", "tokio-runtime"] }
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
keyring = { version = "3.6", features = ["windows-native"] }
winreg = "0.56"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }
