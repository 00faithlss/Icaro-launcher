[package]
name = "icaro-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
iced = { version = "0.13", default-features = false, features = ["wgpu", "tiny-skia", "image", "canvas", "advanced", "svg", "tokio", "lazy"] }
image = { version = "0.24.9", default-features = false, features = ["png", "jpeg", "webp"] }
tokio = { workspace = true, features = ["sync"] }

[build-dependencies]
embed-resource = "3"
image = { version = "0.24.9", default-features = false, features = ["webp", "png"] }

[dev-dependencies]
iced_tiny_skia = "0.13"
icaro-core = { path = "../core" }
tokio-util = { version = "0.7", features = ["rt"] }
serde_json.workspace = true
serde.workspace = true
pulldown-cmark = { version = "0.11", default-features = false }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[target.'cfg(windows)'.dev-dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
